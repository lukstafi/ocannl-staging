name: apt fallback probe
on:
  workflow_dispatch:
jobs:
  apt-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [ordinary, blocked, healthy-primary]
    steps:
    - name: Configure the controlled primary
      env:
        MODE: ${{ matrix.mode }}
      run: |
        if [ "$MODE" = blocked ]; then
          echo '192.0.2.1 azure.archive.ubuntu.com' | sudo tee -a /etc/hosts
          # Give apt's built-in mirror transport only the blocked primary.
          printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo rm -r /var/lib/apt/lists/*
        elif [ "$MODE" = healthy-primary ]; then
          sudo python3 - <<'PYTHON'
        from pathlib import Path
        for p in (Path('/etc/apt/sources.list'), Path('/etc/apt/sources.list.d/ubuntu.sources')):
            if p.exists():
                p.write_text(p.read_text().replace('azure.archive.ubuntu.com', 'archive.ubuntu.com')
                             .replace('mirror+file:/etc/apt/apt-mirrors.txt', 'https://archive.ubuntu.com/ubuntu'))
        PYTHON
        fi
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
          if [ -f "$f" ]; then echo "SOURCE $f"; cat "$f"; fi
        done
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
          if [ -f "$f" ]; then sha256sum "$f"; fi
        done > /tmp/apt-sources-before
    - name: Update apt package index
      run: |
        mirror=$(python3 - <<'PYTHON'
        from pathlib import Path
        import re
        paths = (Path("/etc/apt/sources.list.d/ubuntu.sources"), Path("/etc/apt/sources.list"),
                 Path("/etc/apt/apt-mirrors.txt"))
        source = "\n".join(line for p in paths if p.exists() for line in p.read_text().splitlines()
                           if not line.lstrip().startswith("#"))
        print(" / ".join(sorted(set(re.findall(r"https?://([^/\s]+)", source)))))
        PYTHON
        )
        for attempt in 1 2; do
          if [ "$attempt" -eq 2 ]; then
            # Both source layouts occur on hosted images. Split mixed deb822 suites
            # so the security pocket uses security.ubuntu.com, including over HTTPS.
            sudo python3 - <<'PYTHON'
        from pathlib import Path
        import re

        host = "azure.archive.ubuntu.com"
        mirror_uri = "mirror+file:/etc/apt/apt-mirrors.txt"
        mirror_list = Path("/etc/apt/apt-mirrors.txt")
        azure_list = mirror_list.exists() and host in mirror_list.read_text()

        def uses_azure(text):
            return host in text or (azure_list and mirror_uri in text)

        def fallback(text, security):
            target = "security.ubuntu.com" if security else "archive.ubuntu.com"
            text = text.replace(host, target)
            return text.replace(mirror_uri, f"https://{target}/ubuntu") if azure_list else text

        found = False
        for path in (Path("/etc/apt/sources.list.d/ubuntu.sources"), Path("/etc/apt/sources.list")):
            if not path.exists():
                continue
            source = path.read_text()
            if not uses_azure(source):
                continue
            found = True
            if path.suffix == ".sources":
                blocks = []
                for block in source.split("\n\n"):
                    if not uses_azure(block):
                        blocks.append(block)
                        continue
                    suites = re.search(r"^Suites: (.+)$", block, re.M)
                    if not suites:
                        raise SystemExit(f"::error::Cannot find Suites in {path}'s Azure source")
                    names = suites[1].split()
                    for security in (False, True):
                        selected = [s for s in names if s.endswith("-security") == security]
                        if selected:
                            part = re.sub(r"^Suites: .+$", "Suites: " + " ".join(selected), block, flags=re.M)
                            blocks.append(fallback(part, security))
                source = "\n\n".join(blocks)
            else:
                source = "\n".join(
                    fallback(line, bool(re.search(r"\S+-security(?:\s|$)", line)))
                    for line in source.split("\n")
                )
            path.write_text(source)
            print(f"Fallback Ubuntu sources in {path}:\n{source}", flush=True)
        if not found:
            raise SystemExit("::error title=apt-get update::Cannot switch mirrors: neither Ubuntu source file contains Azure or references its verified apt-mirrors.txt list")
        PYTHON
            mirror="archive.ubuntu.com / security.ubuntu.com"
          fi
          echo "apt-get update attempt $attempt of 2 using $mirror"
          rc=0
          sudo timeout --kill-after=15 240 apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o APT::Update::Error-Mode=any || rc=$?
          [ "$rc" -eq 0 ] && exit 0
          case $rc in 124|137) last="stalled past 240s (apt mirror stall)" ;; *) last="failed with exit $rc" ;; esac
          echo "::warning title=apt-get update::attempt $attempt of 2 using $mirror $last"
        done
        echo "::error title=apt-get update::sudo apt-get update did not complete in 2 capped attempts; the last $last. The apt index refresh precedes the change under test: re-run the job."
        exit 1
    - name: Successful first attempt preserves source files
      if: matrix.mode == 'healthy-primary'
      run: sha256sum -c /tmp/apt-sources-before
