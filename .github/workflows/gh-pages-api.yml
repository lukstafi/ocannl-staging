name: github pages api

on:
  push:
    branches:
      - master  # Set a branch name to trigger deployment
    paths-ignore:
      - "docs/**"
      - "test/**"

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    # Avoid Ubuntu 24.04, see: https://github.com/ocaml/opam/issues/5968
    runs-on: ubuntu-22.04
    steps:
      # Refresh the apt index: the runner image's package lists go stale, making
      # opam's depext step 404 on superseded package versions. `ci.yml` carries
      # the same step for the same reason; without it the `Deps` step below dies
      # on `libcurl4-gnutls-dev` 404 and this workflow never publishes (gh-ocannl-698).
      # No `runner.os` guard: `runs-on` above is pinned to ubuntu.
      - name: Update apt package index
        run: sudo apt-get update

      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5.0'

      - name: Pin
        run: opam pin -n .

      # Resolve only after every pin is registered; the live registry is the
      # source of truth for the cache key in both workflows.
      - name: Resolve pinned dependency revisions
        id: pins
        uses: ./.github/actions/pin-revisions

      # This caches opam's ROOT, not a built switch: setup-ocaml above makes a
      # LOCAL switch (`_opam` in the workspace, per `current-switch` in the run
      # log), which nothing here caches, so `Deps` compiles the ~180 dependencies
      # from source on every run and what this entry buys is the download cache
      # and the repository index. `ci.yml` caches `_opam` instead, and the two do
      # not converge in this commit: caching a switch brings the depext trap with
      # it (depexts are SYSTEM packages, so they live on the runner and not in
      # `_opam`, and a hit yields a switch whose OCaml bindings have no libraries
      # to link against -- `ci.yml` carries an unconditional depext step for
      # exactly that), and this workflow triggers only on push to master, so no
      # change to it can be tried on a pull request first. Converging on `_opam`
      # is worth doing -- it is where this job's three minutes go -- but as its
      # own change, deliberately; the key, whose worst case is one cold run, is
      # what lands here.
      #
      # The key must still move with the dependencies. It was the literal
      # `opam-ubuntu-22.04-5.5.0`: an exact hit every run, and an exact hit means
      # actions/cache does not SAVE ("Cache hit occurred on the primary key ...,
      # not saving cache"), so whatever root was captured the day the entry was
      # first written was served back until the 7-day read eviction retired it --
      # freshness as a function of the calendar rather than of the dependencies,
      # which is what made gh-ocannl-698's runs fail in two different steps on
      # one tree (gh-ocannl-732). Keyed on the opam files and the resolved pin revisions
      # it moves when they do, and `restore-keys` keeps the miss warm: the
      # previous root is restored, this run refreshes it, and the post step
      # writes it back under the new key. Restore happens after pin derivation
      # because that derivation reads the live local switch; the switch is in
      # `_opam`, outside the cached root, so restoring the root cannot replace
      # its registry.
      - name: Cache opam
        id: cache-opam
        uses: actions/cache@v6
        with:
          path: ~/.opam
          key: opam-root-ubuntu-22.04-5.5.0-${{ hashFiles('*.opam') }}-${{ steps.pins.outputs.digest }}
          restore-keys: |
            opam-root-ubuntu-22.04-5.5.0-

      - name: Deps
        run: opam install -ydt . --deps-only

      - name: Build
        run: opam exec -- dune build @doc

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/default/_doc/_html/
          destination_dir: dev
          enable_jekyll: true
