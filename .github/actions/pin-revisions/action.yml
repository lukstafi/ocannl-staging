name: Resolve opam dependency source revisions
description: >-
  Resolve the ordinary-package solution and every remote git pin in the
  current switch, and emit short digests to mix into an opam cache key.

# Why this exists at all: an opam cache key built from `hashFiles('*.opam')`
# alone is blind to ordinary package releases and metadata changes in the live
# opam repositories, and to every pin that tracks a BRANCH. `ppx_minidebug#main`,
# `notty-community#master` and `dataprep#main` move while the opam files stay
# byte-identical, so a key that ignores either registry serves a switch built
# from stale sources indefinitely. The workflow's verdict then becomes a fact
# about cache age rather than the dependency state under test. Over-invalidating
# costs one rebuild; under-invalidating is silent staleness, so the trade is not
# close.
#
# Why it is an action rather than a copy per workflow: ordinary-package and pin
# resolution are one cohesive question ("which dependency sources will the
# switch contain right now?") and drift between two copies of the answer is
# precisely the failure gh-ocannl-732 recorded. Both `ci.yml` and
# `gh-pages-api.yml` cache `_opam` and exercise this action on pull requests;
# their entries stay separate because their runner matrices and key shapes
# differ. Callers run this after setup-ocaml has updated the repositories and
# after all `opam pin -n` steps, so the live solver state is the source of truth.

outputs:
  digest:
    description: >-
      Twelve hex characters standing for the resolved revisions; changes iff any
      pin moved.
    value: ${{ steps.resolve.outputs.digest }}
  solution-digest:
    description: >-
      Twelve hex characters standing for the solved ordinary-package set and
      its package definitions.
    value: ${{ steps.resolve.outputs.solution-digest }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"
